name: CI

on:
  push:
    branches: [main]
    paths:
      - "**/*.swift"
  pull_request:
    paths:
      - "**/*.swift"

jobs:
  lint-and-build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: brew install swiftlint swift-format xcbeautify

      - name: swift-format lint
        run: swift-format lint --recursive Sources Tests

      - name: swiftlint
        run: swiftlint lint

      - name: Build
        run: bash scripts/build.sh
